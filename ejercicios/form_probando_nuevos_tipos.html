<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formularios</title>
</head>
<body>
    <form action="validar.php" method="get">
        <fieldset>
            <legend>Para datos personales</legend>
            <label for="Teléfono">Teléfono</label>
            <input type="text" name="teléfono" id="Teléfono" placeholder="9 números" maxlength="9" size="9"></br>
            <label for="email">Correo Eléctronico</label>
            <input type="text" name="email" id="email" placeholder="El formato correcto es nombre + @ + servidor de correo">
        </fieldset>
        <fieldset>
            <legend>Para datos numéricos</legend>
            <label for="número">Número de personas</label>
            <input type="number" min="0" max="20" step="1" value="1" id="número" /></br>
            <label for="nota">Indica tu puntuación del 1 al 10</label>
            <input type="range" min="1" max="10" step="1" value="0" />
        </fieldset>
        <fieldset>
            <legend>Url y búsqueda</legend>
            <label for="url">URL</label>
            <input type="url" for="url"/></br>
            <label for="búsqueda">¿Qué te interesa buscar?</label>
            <input type="text" id="búsqueda" name="buscar" value=""/> 
        </fieldset>
        <fieldset>
            <legend>Otros</legend>
            <label for="color">Color</label>
            <input type="color" id="color"/>
        </fieldset>
        <fieldset>
            <legend>Para fechas</legend>
            <label for="dia">Día</label>
            <input type="date" id="dia" max="2026-12-31"/></br>
            <label for="hora">Hora</label>
            <input type="time" id="hora"/></br>
            <label for="Mes">Mes</label>
            <input type="month" id="mes"/></br>
            <label for="semana">Semana</label>
            <input type="week" id="semana"/></br>
            <label for="fecha">Fecha y hora</label>
            <input type="datetime-local" id="fecha"/></br>
        </fieldset>
        <input type="submit">
        <input type="reset">
    </form>
</body>










</html>
